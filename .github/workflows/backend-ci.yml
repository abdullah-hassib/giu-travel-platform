name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.nvmrc'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Typecheck, build, lint, unit and HTTP/DB tests
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    env:
      CI: 'true'
      # Every e2e suite creates a disposable localhost MongoDB replica set.
      # No MONGODB_URI, Stripe keys, shared Atlas data, or .env files are used.
      MONGOMS_VERSION: '8.2.7'
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache isolated MongoDB test binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-${{ runner.arch }}-8.2.7

      - name: Install locked backend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify official reference CSVs without database writes
        run: npm run seed:reference

      - name: HTTP and disposable MongoDB replica-set tests
        run: npm run test:e2e
